<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Reconciliation: evidence required for expansion</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="51.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Reconciliation: evidence required for expansion</text><text x="48" y="85.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Proposed research program · advancement depends on evidence</text><text x="48" y="135.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Backward requirements</text><text x="648" y="135.0" font-size="24" fill="#167d8d" text-anchor="start" font-weight="600">Forward evidence</text><rect x="48" y="166" width="492" height="86" rx="12" fill="#f3f5f5" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="200.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Heterogeneous external</text><text x="70" y="228.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">systems</text><rect x="48" y="294" width="492" height="86" rx="12" fill="#f3f5f5" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="328.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Repeated work and</text><text x="70" y="356.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">late evidence</text><rect x="48" y="422" width="492" height="86" rx="12" fill="#f3f5f5" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="456.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Supported disposition</text><text x="70" y="484.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">under faults</text><rect x="48" y="550" width="492" height="86" rx="12" fill="#f3f5f5" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="584.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">One inspectable transaction</text><path d="M294,258 L294,288" fill="none" stroke="#20363b" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M294,386 L294,416" fill="none" stroke="#20363b" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M294,514 L294,544" fill="none" stroke="#20363b" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="648" y="166" width="504" height="64" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="191.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 6 · generalize the</text><text x="668" y="217.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">supported boundary</text><rect x="648" y="248" width="504" height="64" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="287.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 5 · establish value and transfer</text><rect x="648" y="330" width="504" height="64" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="355.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 4 · keep residual work</text><text x="668" y="381.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">governable</text><rect x="648" y="412" width="504" height="64" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="437.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 3 · challenge absence,</text><text x="668" y="463.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">retry and reversal</text><rect x="648" y="494" width="504" height="64" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="533.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 2 · one supported policy</text><rect x="648" y="576" width="504" height="64" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="615.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 1 · one observable action</text><path d="M900,246 L900,232" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M900,328 L900,314" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M900,410 L900,396" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M900,492 L900,478" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M900,574 L900,560" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="48" y="681.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Loose alignment of levels; stages don’t automatically establish sufficient evidence.</text></g></svg>