<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title"><title id="title">A successor admits the next action</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="76.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">A successor admits the next action</text><text x="48" y="114.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Admission depends on task-relative state and usable context.</text><rect x="48" y="168" width="240" height="112" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="168" y="212.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Record received</text><rect x="336" y="168" width="240" height="112" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="456" y="212.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Refresh relevant</text><text x="456" y="240.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">conditions</text><rect x="624" y="168" width="240" height="112" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="744" y="212.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Accept</text><text x="744" y="240.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">responsibility</text><rect x="912" y="168" width="240" height="112" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="1032" y="212.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Admit next action</text><path d="M288,224 L336,224" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M576,224 L624,224" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M864,224 L912,224" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1032,280 L1032,316 L744,316 L744,352" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1032,280 L1032,352" fill="none" stroke="#b95e3c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#rust)"/><rect x="624" y="352" width="240" height="100" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="744" y="391.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Continue within</text><text x="744" y="419.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">support</text><rect x="912" y="352" width="240" height="100" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5"/><text x="1032" y="407.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Justified refusal</text><rect x="48" y="352" width="528" height="100" rx="12" fill="white" stroke="#b95e3c" stroke-width="1.5"/><text x="68" y="383.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Receipt alone is insufficient</text><text x="68" y="414.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Permission, understanding and capacity</text><text x="68" y="437.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">need a current basis.</text><text x="48" y="510.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Functional sketch; no mandatory record fields.</text><text x="1152" y="510.0" font-size="18" fill="#52676c" text-anchor="end" font-weight="400">Alternative outcomes</text></g></svg>