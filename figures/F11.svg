stroke="#bdd0d1" stroke-width="1.5" /><text x="417.0" y="259.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="400">Relevant evidence</text><rect x="554" y="228" width="172" height="49" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="640.0" y="259.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="400">Uncertainty</text><rect x="300" y="293" width="172" height="49" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="386.0" y="324.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="400">Authority</text><rect x="488" y="293" width="238" height="49" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="607.0" y="324.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="400">Migration conditions</text><text x="300" y="365.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Commitment information retained</text><path d="M220,285 L276,285" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M750,285 L810,285" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="810" y="208" width="334" height="150" rx="12" fill="#edf5f4" stroke="#167d8d" stroke-width="1.5" /><text x="834" y="245.0" font-size="20" fill="#167d8d" text-anchor="start" font-weight="400">Check compatibility</text><text x="834" y="283.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Supported next action</text><text x="834" y="320.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">after checking</text><rect x="276" y="434" width="474" height="208" rx="12" fill="white" stroke="#b95e3c" stroke-width="1.5" /><text x="300" y="468.0" font-size="22" fill="#b95e3c" text-anchor="start" font-weight="600">Context lost</text><rect x="300" y="488" width="426" height="47" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="322" y="518.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Some relevant context still crosses</text><rect x="300" y="550" width="426" height="70" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5" /><text x="322" y="578.0" font-size="20" fill="#b95e3c" text-anchor="start" font-weight="400">Missing: migration context</text><text x="322" y="605.0" font-size="20" fill="#b95e3c" text-anchor="start" font-weight="400">and commitment information</text><path d="M220,545 L276,545" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M750,545 L810,545" fill="none" stroke="#b95e3c" stroke-width="2.5" marker-end="url(#rust)" /><rect x="810" y="468" width="334" height="150" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5" /><text x="834" y="506.0" font-size="20" fill="#b95e3c" text-anchor="start" font-weight="400">Mismatch at receipt</text><text x="834" y="547.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Incompatible rollback</text><text x="834" y="575.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">assumption</text><text x="48" y="689.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Missing handoff context doesn’t establish component incompetence.</text></g></svg>