<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">The work behind an intervention</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="77.0" font-size="30" fill="#20363b" text-anchor="start" font-weight="600">The work behind an intervention</text><text x="48" y="114.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Proposed / illustrative; not an empirical result</text><text x="48" y="153.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Work required for intervention</text><rect x="48" y="172" width="164" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="130.0" y="216.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Preparation</text><path d="M215,208 L232,208" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="236" y="172" width="192" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="332.0" y="216.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Reorientation</text><path d="M431,208 L448,208" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="452" y="172" width="180" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="542.0" y="216.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Investigation</text><path d="M635,208 L652,208" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="656" y="172" width="148" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="730.0" y="216.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Decision</text><path d="M807,208 L824,208" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="828" y="172" width="140" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="898.0" y="216.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Action</text><path d="M971,208 L988,208" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="992" y="172" width="160" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="1072.0" y="216.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Verification</text><rect x="280" y="266" width="708" height="44" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="634" y="295.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="400">Acknowledgment isn’t completed intervention</text><path d="M130,244 L130,318 L1080,318 L1080,330" fill="none" stroke="#bdd0d1" stroke-width="2.5" /><rect x="48" y="330" width="1104" height="286" rx="12" fill="#f7faf9" stroke="#bdd0d1" stroke-width="1.5" /><text x="76" y="370.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Simultaneous requests</text><text x="720" y="370.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Available capacity</text><rect x="76" y="399" width="112" height="32" rx="5" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><path d="M92,415 L172,415" fill="none" stroke="#52676c" stroke-width="2.5" /><rect x="76" y="445" width="112" height="32" rx="5" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><path d="M92,461 L172,461" fill="none" stroke="#52676c" stroke-width="2.5" /><rect x="76" y="491" width="112" height="32" rx="5" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><path d="M92,507 L172,507" fill="none" stroke="#52676c" stroke-width="2.5" /><path d="M200,403 L316,403 L316,510 L200,510" fill="none" stroke="#b95e3c" stroke-width="2.5" stroke-dasharray="7 6" /><text x="220" y="454.0" font-size="18" fill="#b95e3c" text-anchor="start" font-weight="400">Waiting</text><path d="M316,455 L392,455" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="398" y="404" width="722" height="90" rx="12" fill="#edf5f4" stroke="#167d8d" stroke-width="1.5" /><text x="759" y="439.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="400">Shared capacity for competent action</text><text x="759" y="470.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">Requests compete for usable time and capability</text><text x="76" y="563.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Illustrative demand;</text><text x="76" y="587.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">no count or time scale</text><path d="M508.0,494 L508.0,525" fill="none" stroke="#bdd0d1" stroke-width="2.5" /><rect x="398" y="525" width="220" height="65" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="508.0" y="565.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Qualified people</text><path d="M760.0,494 L760.0,525" fill="none" stroke="#bdd0d1" stroke-width="2.5" /><rect x="638" y="525" width="244" height="65" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="760.0" y="565.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Context and access</text><path d="M1011.0,494 L1011.0,525" fill="none" stroke="#bdd0d1" stroke-width="2.5" /><rect x="902" y="525" width="218" height="65" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="1011.0" y="565.0" font-size="20" fill="#20363b" text-anchor="middle" font-weight="600">Decision rights</text><text x="48" y="660.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Every stage consumes capacity; waiting conditions depend on the service.</text></g></svg>