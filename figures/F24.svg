<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Acknowledgment lost, effect still possible</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="70.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Acknowledgment lost, effect still possible</text><text x="48" y="106.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Proposed / illustrative; not an empirical result</text><text x="72" y="157.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="600">LOCAL</text><rect x="72" y="185" width="190" height="100" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="167" y="243.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Local intent</text><rect x="310" y="185" width="170" height="100" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="395" y="243.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Dispatch</text><path d="M262,235 L310,235" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="570" y="185" width="280" height="130" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5" /><text x="710" y="237.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Effect status:</text><text x="710" y="265.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">unknown</text><rect x="910" y="185" width="242" height="130" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="1031" y="226.0" font-size="22" fill="#20363b" text-anchor="middle" font-