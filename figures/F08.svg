<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">The live edge and its supporting history</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="48.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Conceptual map · functional requirements</text><rect x="48" y="80" width="528" height="510" rx="12" fill="#f8fbfb" stroke="#bdd0d1" stroke-width="1.5" /><rect x="624" y="80" width="528" height="510" rx="12" fill="#f8fbfb" stroke="#bdd0d1" stroke-width="1.5" /><text x="72" y="118.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">The live edge</text><text x="72" y="147.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">State governing the next transition</text><text x="648" y="118.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Supporting history</text><text x="648" y="147.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Retained records for present checks</text><rect x="72" y="172" width="480" height="58" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="92" y="208.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Current objective</text><rect x="72" y="244" width="480" height="58" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="92" y="280.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Authoritative artifact</text><rect x="72" y="316" width="480" height="58" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="92" y="352.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Next transition owner</text><rect x="72" y="388" width="480" height="58" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="92" y="424.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Relevant authority</text><rect x="72" y="460" width="480" height="104" rx="8" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5" /><text x="92" y="493.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Uncertainty and pending effects</text><text x="92" y="523.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Remain active until resolved;</text><text x="92" y="548.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">a historical record doesn’t close them.</text><rect x="648" y="172" width="480" height="64" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="208.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Observations</text><rect x="648" y="252" width="480" height="64" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="288.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Inferences</text><rect x="648" y="332" width="480" height="64" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="368.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Decisions and corrections</text><rect x="648" y="412" width="480" height="88" rx="8" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="668" y="448.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">Authority and</text><text x="668" y="476.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="400">responsibility history</text><text x="648" y="533.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Records don’t establish present</text><text x="648" y="558.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">authority or current capacity.</text><path d="M888,590 L888,620 L312,620 L312,590" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="600" y="663.0" font-size="22" fill="#167d8d" text-anchor="middle" font-weight="600">Relevant provenance supports present checks</text><text x="600" y="693.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">Evidence support for checking the live state</text></g></svg>