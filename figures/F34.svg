390" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="477" y="353.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">informs</text><rect x="330" y="390" width="258" height="136" rx="12" fill="#f5f7f7" stroke="#bdd0d1" stroke-width="1.5" /><text x="459" y="430.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="400">Which relations</text><text x="459" y="458.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="400">support an action?</text><rect x="612" y="170" width="258" height="136" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="741" y="228.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Bounded empirical</text><text x="741" y="256.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">examples</text><path d="M741,306 L741,390" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="759" y="353.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">informs</text><rect x="612" y="390" width="258" height="136" rx="12" fill="#f5f7f7" stroke="#bdd0d1" stroke-width="1.5" /><text x="741" y="430.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="400">What works under</text><text x="741" y="458.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="400">stated conditions?</text><rect x="894" y="170" width="258" height="136" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="1023" y="228.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Domain methods</text><path d="M1023,306 L1023,390" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="1041" y="353.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">informs</text><rect x="894" y="390" width="258" height="136" rx="12" fill="#f5f7f7" stroke="#bdd0d1" stroke-width="1.5" /><text x="1023" y="430.0" font-size="22" fill="