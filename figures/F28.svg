<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Controller knowledge and evaluator knowledge</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="70.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Controller knowledge and evaluator knowledge</text><text x="48" y="98.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Conceptual diagram</text><rect x="48" y="120" width="1048" height="126" rx="12" fill="#f5f7f7" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="164.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Mutable world</text><text x="70" y="193.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Changing state and effects</text><rect x="350" y="138" width="300" height="90" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><rect x="350" y="150" width="4" height="66" fill="#167d8d" /><text x="370" y="170.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">World state</text><text x="370" y="206.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Conditions change</text><rect x="720" y="138" width="356" height="90" rx="12" fill="#faf0e9" stroke="#bdd0d1" stroke-width="1.5" /><text x="740" y="169.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Hidden effects</text><text x="740" y="194.0" font-size="18" fill="#b95e3c" text-anchor="start" font-weight="400">Evaluator-visible;</text><text x="740" y="217.0" font-size="18" fill="#b95e3c" text-anchor="start" font-weight="400">not controller-known</text><rect x="48" y="298" width="1048" height="122" rx="12" fill="#f5f7f7" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="339.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Controller observations</text><text x="70" y="368.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Limited coverage</text><rect x="350" y="314" width="300" height="90" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><rect x="350" y="326" width="4" height="66" fill="#167d8d" /><text x="370" y="346.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Available evidence</text><text x="370" y="382.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Missing: unknown</text><rect x="758" y="314" width="318" height="90" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><rect x="758" y="326" width="4" height="66" fill="#167d8d" /><text x="778" y="346.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Working account</text><text x="778" y="382.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">May be incomplete</text><path d="M650,359 L754,359" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="704" y="342.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">informs</text><path d="M492,228 L492,310" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><rect x="368" y="258" width="248" height="26" rx="0" fill="white" stroke="white" stroke-width="1.5" /><text x="492" y="278.0" font-size="18" fill="#b95e3c" text-anchor="middle" font-weight="400">Partial / delayed</text><rect x="48" y="474" width="1104" height="132" rx="12" fill="#f5f7f7" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="513.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Independent evaluator</text><text x="70" y="541.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">sources</text><text x="70" y="575.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Independent of reports</text><rect x="350" y="490" width="726" height="98" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="370" y="522.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Effect and consequence records</text><text x="370" y="550.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Occurrence / observation / recording</text><text x="370" y="575.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Source independence: check shared dependencies</text><path d="M1076,183 L1128,183 L1128,540 L1080,540" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="805" y="452.0" font-size="18" fill="#167d8d" text-anchor="start" font-weight="400">Independent effect inspection</text><text x="48" y="647.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Ground truth isn’t automatically controller knowledge</text><text x="48" y="681.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Signature isn’t semantic truth</text><text x="650" y="681.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Signature → attributed record</text></g></svg>