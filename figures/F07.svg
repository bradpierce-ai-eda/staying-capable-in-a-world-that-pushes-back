<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Different shapes of consequence</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="74.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Different shapes of consequence</text><text x="48" y="108.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Qualitative profiles</text><text x="306" y="149.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="600">Reversibility</text><text x="570" y="149.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="600">Visibility / propagation</text><text x="870" y="149.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="600">Future options</text><rect x="48" y="174" width="1104" height="102" rx="12" fill="#f6f9f9" stroke="#bdd0d1" stroke-width="1.5"/><path d="M284,192 L284,258" fill="none" stroke="#bdd0d1" stroke-width="2.5"/><text x="68" y="231.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Inspect telemetry</text><text x="306" y="231.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">High reversibility</text><text x="570" y="231.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Low and internal</text><text x="870" y="231.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Preserves options</text><rect x="48" y="298" width="1104" height="102" rx="12" fill="#f6f9f9" stroke="#bdd0d1" stroke-width="1.5"/><path d="M284,316 L284,382" fill="none" stroke="#bdd0d1" stroke-width="2.5"/><text x="68" y="355.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Disable a feature</text><text x="306" y="355.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Usually reversible</text><text x="570" y="355.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Visible but bounded</text><text x="870" y="343.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Temporarily narrows</text><text x="870" y="369.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">service</text><rect x="48" y="422" width="1104" height="102" rx="12" fill="#f6f9f9" stroke="#bdd0d1" stroke-width="1.5"/><path d="M284,440 L284,506" fill="none" stroke="#bdd0d1" stroke-width="2.5"/><text x="68" y="479.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Reverse schema</text><text x="306" y="467.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Often low after</text><text x="306" y="493.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">writes</text><text x="570" y="467.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Propagates through</text><text x="570" y="493.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">data and clients</text><text x="870" y="467.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">May destroy recovery</text><text x="870" y="493.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">paths</text><rect x="48" y="546" width="1104" height="102" rx="12" fill="#f6f9f9" stroke="#bdd0d1" stroke-width="1.5"/><path d="M284,564 L284,630" fill="none" stroke="#bdd0d1" stroke-width="2.5"/><text x="68" y="591.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Publish status</text><text x="68" y="617.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">message</text><text x="306" y="591.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Editable but not</text><text x="306" y="617.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">unseen</text><text x="570" y="603.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Public and durable</text><text x="870" y="591.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Constrains later</text><text x="870" y="617.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">communication</text></g></svg>