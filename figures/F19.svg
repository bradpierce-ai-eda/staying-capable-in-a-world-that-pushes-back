<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Scope choices and continuing duties</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="64.0" font-size="30" fill="#20363b" text-anchor="start" font-weight="600">Scope choices and continuing duties</text><text x="48" y="103.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Conceptual diagram</text><rect x="48" y="126" width="1104" height="206" rx="12" fill="#f7f9f9" stroke="#bdd0d1" stroke-width="1.5" /><text x="72" y="164.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">New commitments</text><text x="480" y="164.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Alternative scope decisions — no required order</text><path d="M192,198 L984,198" fill="none" stroke="#52676c" stroke-width="2.5" stroke-dasharray="7 6" /><path d="M192,198 L192,228" fill="none" stroke="#52676c" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="72" y="228" width="240" height="76" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="192" y="273.0" font-size="24" fill="#20363b" text-anchor="middle" font-weight="600">Narrow scope</text><path d="M456,198 L456,228" fill="none" stroke="#52676c" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="336" y="228" width="240" height="76" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="456" y="273.0" font-size="24" fill="#20363b" text-anchor="middle" font-weight="600">Suspend</text><path d="M720,198 L720,228" fill="none" stroke="#52676c" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="600" y="228" width="240" height="76" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="720" y="273.0" font-size="24" fill="#20363b" text-anchor="middle" font-weight="600">Replace</text><path d="M984,198 L984,228" fill="none" stroke="#52676c" stroke-width="2.5" stroke-dasharray="7 6" /><rect x="864" y="228" width="240" height="76" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="984" y="273.0" font-size="24" fill="#20363b" text-anchor="middle" font-weight="600">Retire</text><rect x="48" y="356" width="1104" height="292" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="72" y="398.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Earlier commitments remain in the account</text><rect x="72" y="426" width="280" height="102" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="92" y="466.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Existing effects</text><path d="M212,528 L212,570" fill="none" stroke="#167d8d" stroke-width="2.5" /><rect x="372" y="426" width="280" height="102" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="392" y="466.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Evidence access</text><path d="M512,528 L512,570" fill="none" stroke="#167d8d" stroke-width="2.5" /><rect x="672" y="426" width="280" height="102" rx="12" fill="white" stroke="#bdd0d1" stroke-width="1.5" /><text x="692" y="466.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Accepted</text><text x="692" y="494.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">responsibility</text><path d="M812,528 L812,570" fill="none" stroke="#167d8d" stroke-width="2.5" /><path d="M72,570 L1104,570" fill="none" stroke="#167d8d" stroke-width="2.5" /><circle cx="1104" cy="570" r="7" fill="#167d8d" /><text x="72" y="618.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Residual duties continue until disposition</text><text x="1104" y="610.0" font-size="20" fill="#20363b" text-anchor="end" font-weight="600">Disposition</text><text x="48" y="686.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Stopping operation alone doesn’t settle earlier obligations.</text></g></svg>