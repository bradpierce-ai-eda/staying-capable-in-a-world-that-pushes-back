<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Where the repair work lands</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="64.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Where the repair work lands</text><text x="48" y="101.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Illustrative work map · proposed evaluation scope, not measured outcomes</text><text x="350" y="147.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Declared accounting boundary</text><rect x="338" y="164" width="400" height="402" rx="12" fill="none" stroke="#52676c" stroke-width="2" stroke-dasharray="8 6"/><rect x="350" y="180" width="176" height="370" rx="8" fill="#f6f8f8" stroke="#bdd0d1" stroke-width="1.5"/><text x="438" y="214.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Provider</text><rect x="550" y="180" width="176" height="370" rx="8" fill="#f6f8f8" stroke="#bdd0d1" stroke-width="1.5"/><text x="638" y="214.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Operator</text><rect x="750" y="180" width="176" height="370" rx="8" fill="#f6f8f8" stroke="#bdd0d1" stroke-width="1.5"/><text x="838" y="214.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Customer</text><rect x="950" y="180" width="176" height="370" rx="8" fill="#f6f8f8" stroke="#bdd0d1" stroke-width="1.5"/><text x="1038" y="214.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Downstream</text><text x="1038" y="242.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">parties</text><text x="64" y="230.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="600">Work to trace</text><text x="64" y="292.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Configuration upkeep</text><path d="M376,300 L1100,300" fill="none" stroke="#b95e3c" stroke-width="2.5" stroke-dasharray="7 6"/><text x="64" y="367.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Exception handling</text><path d="M376,375 L1100,375" fill="none" stroke="#b95e3c" stroke-width="2.5" stroke-dasharray="7 6"/><text x="64" y="442.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Repair and</text><text x="64" y="468.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">reconciliation</text><path d="M376,450 L1100,450" fill="none" stroke="#b95e3c" stroke-width="2.5" stroke-dasharray="7 6"/><text x="64" y="517.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Unfinished</text><text x="64" y="543.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">commitments</text><path d="M376,525 L1100,525" fill="none" stroke="#b95e3c" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M64,604 L124,604" fill="none" stroke="#b95e3c" stroke-width="2.5" stroke-dasharray="7 6"/><text x="140" y="610.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Possible movement of work; allocation depends on the configuration</text><text x="64" y="663.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Work beyond the boundary must remain visible</text></g></svg>