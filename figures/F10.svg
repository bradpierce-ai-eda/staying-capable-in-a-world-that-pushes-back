<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">The world has moved on</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="76.0" font-size="30" fill="#20363b" text-anchor="start" font-weight="600">The world has moved on</text><text x="48" y="111.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Illustrative recovery routes</text><rect x="48" y="210" width="300" height="136" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="250.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Earlier application</text><text x="70" y="279.9" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">state</text><text x="70" y="319.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Earlier release version</text><rect x="420" y="174" width="732" height="232" rx="12" fill="#f7faf9" stroke="#bdd0d1" stroke-width="1.5" /><text x="444" y="207.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Present operating conditions</text><rect x="444" y="235" width="206" height="104" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="464" y="271.0" font-size="21" fill="#20363b" text-anchor="start" font-weight="600">Current</text><text x="464" y="298.3" font-size="21" fill="#20363b" text-anchor="start" font-weight="600">application</text><rect x="675" y="235" width="205" height="104" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="695" y="270.0" font-size="21" fill="#20363b" text-anchor="start" font-weight="600">Schema</text><text x="695" y="297.3" font-size="21" fill="#20363b" text-anchor="start" font-weight="600">migration</text><rect x="905" y="235" width="223" height="104" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="925" y="270.0" font-size="21" fill="#20363b" text-anchor="start" font-weight="600">Adapted</text><text x="925" y="297.3" font-size="21" fill="#20363b" text-anchor="start" font-weight="600">clients</text><text x="675" y="380.0" font-size="21" fill="#52676c" text-anchor="start" font-weight="400">Surrounding changes remain</text><path d="M444,287 L390,287 L390,150 L198,150 L198,210" fill="none" stroke="#b95e3c" stroke-width="2.5" marker-end="url(#rust)" /><text x="274" y="137.0" font-size="20" fill="#b95e3c" text-anchor="start" font-weight="400">Restore application version</text><path d="M547,406 L547,490" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="48" y="468.0" font-size="23" fill="#167d8d" text-anchor="start" font-weight="600">Valid recovery route</text><text x="48" y="501.0" font-size="19" fill="#52676c" text-anchor="start" font-weight="400">Under current checks</text><rect x="420" y="490" width="300" height="96" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="444" y="531.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Degraded</text><text x="444" y="560.9" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">operation</text><rect x="840" y="490" width="312" height="96" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="864" y="547.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Staged repair</text><path d="M720,538 L840,538" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><text x="780" y="448.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">Subject to</text><text x="780" y="473.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">current checks</text><rect x="48" y="618" width="1104" height="54" rx="12" fill="#f7faf9" stroke="#bdd0d1" stroke-width="1.5" /><text x="72" y="653.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Preserve discoveries and pending duties</text><text x="48" y="548.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">A possible route; repair</text><text x="48" y="571.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">isn’t guaranteed.</text></g></svg>