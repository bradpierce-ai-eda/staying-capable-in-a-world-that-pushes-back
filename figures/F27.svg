<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">A recurring maintenance loop</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="74.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Proposed maintenance loop</text><text x="48" y="111.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Delivery changes conditions for later work</text><rect x="80" y="175" width="310" height="100" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="100" y="231.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Delivery episode</text><rect x="480" y="175" width="330" height="165" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="500" y="215.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Inherited conditions</text><text x="500" y="265.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Understanding / capacity /</text><text x="500" y="288.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">options / duties</text><rect x="480" y="470" width="330" height="100" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="500" y="526.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Assess affected claims</text><rect x="80" y="470" width="310" height="100" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="100" y="512.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Next commitment</text><text x="100" y="540.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">and maintenance</text><path d="M390,225 L478,225" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M645,340 L645,468" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480,520 L392,520" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M235,470 L235,277" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="876" y="280" width="276" height="170" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5"/><text x="896" y="319.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Unresolved work and</text><text x="896" y="345.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">relevant costs</text><text x="896" y="371.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">remain visible</text><text x="80" y="644.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">The loop supplies no guarantee of improvement.</text></g></svg>