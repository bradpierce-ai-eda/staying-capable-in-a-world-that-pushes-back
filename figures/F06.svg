<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">From permission to effective control</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="72.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">From permission to effective control</text><text x="48" y="104.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Conceptual distinctions and control sequence</text><rect x="48" y="138" width="352" height="138" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="72" y="177.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Authorization</text><text x="72" y="216.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Granted by rule</text><text x="72" y="242.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">or principal</text><rect x="424" y="138" width="352" height="138" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="448" y="177.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Exercisability</text><text x="448" y="216.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Can act competently now</text><rect x="800" y="138" width="352" height="138" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="824" y="177.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Legitimacy</text><text x="824" y="216.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Acceptable under</text><text x="824" y="242.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">relevant order</text><text x="48" y="328.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Taking control: distinct claims in sequence</text><rect x="48" y="362" width="200" height="124" rx="12" fill="#f5f8f8" stroke="#bdd0d1" stroke-width="1.5" /><text x="148" y="412.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Receive</text><text x="148" y="440.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">request</text><path d="M252,424 L269,424" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="274" y="362" width="200" height="124" rx="12" fill="#f5f8f8" stroke="#bdd0d1" stroke-width="1.5" /><text x="374" y="412.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Understand</text><text x="374" y="440.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">state</text><path d="M478,424 L495,424" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="500" y="362" width="200" height="124" rx="12" fill="#f5f8f8" stroke="#bdd0d1" stroke-width="1.5" /><text x="600" y="412.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Accept</text><text x="600" y="440.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">responsibility</text><path d="M704,424 L721,424" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="726" y="362" width="200" height="124" rx="12" fill="#f5f8f8" stroke="#bdd0d1" stroke-width="1.5" /><text x="826" y="412.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Issue control</text><text x="826" y="440.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">action</text><path d="M930,424 L947,424" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="952" y="362" width="200" height="124" rx="12" fill="#f5f8f8" stroke="#bdd0d1" stroke-width="1.5" /><text x="1052" y="412.0" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">Stable</text><text x="1052" y="440.6" font-size="22" fill="#20363b" text-anchor="middle" font-weight="600">operation</text><text x="600" y="533.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">Arrows show sequence only; they don’t confirm completion.</text><text x="600" y="565.0" font-size="22" fill="#167d8d" text-anchor="middle" font-weight="600">Each step requires its own evidence</text><rect x="48" y="594" width="1104" height="78" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5" /><text x="72" y="626.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Successful completion of the sequence doesn’t establish broader legitimacy.</text><text x="72" y="654.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Authorization, present exercisability and legitimacy require separate assessment.</text></g></svg>