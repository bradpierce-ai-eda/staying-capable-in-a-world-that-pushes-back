<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title"><title id="title">Recovery composition: evidence required for expansion</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="64.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Recovery composition: evidence required for expansion</text><text x="48" y="100.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Proposed evidence pathway · not an empirical result</text><text x="84" y="149.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Backward requirements</text><text x="684" y="149.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Forward evidence</text><rect x="84" y="178" width="472" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="104" y="208.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Transferable recovery</text><text x="104" y="236.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">composition</text><path d="M64,214 L64,302" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="84" y="266" width="472" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="104" y="296.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Repeated recovery under</text><text x="104" y="324.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">changing conditions</text><path d="M64,302 L64,390" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="84" y="354" width="472" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="104" y="384.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Composition beyond</text><text x="104" y="412.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">frozen recipes</text><path d="M64,390 L64,478" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="84" y="442" width="472" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="104" y="472.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Admission of supplied</text><text x="104" y="500.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">candidates</text><path d="M64,478 L64,566" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="84" y="530" width="472" height="72" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="104" y="573.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">One executable recovery</text><path d="M64,214 L84,214" fill="none" stroke="#167d8d" stroke-width="2.5" /><path d="M64,566 L84,566" fill="none" stroke="#167d8d" stroke-width="2.5" /><rect x="684" y="178" width="468" height="60" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="704" y="203.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 6 · generalize</text><text x="704" y="229.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">supported claims</text><path d="M664,282 L664,208" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="684" y="252" width="468" height="60" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="704" y="277.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 5 · repeated use</text><text x="704" y="303.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">and transfer</text><path d="M664,356 L664,282" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="684" y="326" width="468" height="60" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="704" y="351.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 4 · value beyond</text><text x="704" y="377.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">prepared procedures</text><path d="M664,430 L664,356" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="684" y="400" width="468" height="60" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="704" y="425.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 3 · compose within</text><text x="704" y="451.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">declared bounds</text><path d="M664,504 L664,430" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="684" y="474" width="468" height="60" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="704" y="499.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 2 · defeat</text><text x="704" y="525.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">misleading recovery</text><path d="M664,578 L664,504" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="684" y="548" width="468" height="60" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="704" y="573.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Stage 1 · one</text><text x="704" y="599.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">executable recovery</text><path d="M664,208 L684,208" fill="none" stroke="#167d8d" stroke-width="2.5" /><path d="M664,578 L684,578" fill="none" stroke="#167d8d" stroke-width="2.5" /><text x="600" y="665.0" font-size="22" fill="#167d8d" text-anchor="middle" font-weight="600">Automated composition is the mature goal</text><text x="600" y="704.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">Manual candidates establish the checking foundation; admission doesn’t establish recovery success.</text></g></svg>