<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Two local successes, one system failure</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="64.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Two local successes, one system failure</text><text x="1152" y="100.0" font-size="20" fill="#b95e3c" text-anchor="end" font-weight="400">Constructed counterexample</text><rect x="48" y="124" width="1104" height="246" rx="12" fill="#ffffff" stroke="#bdd0d1" stroke-width="1.5"/><text x="72" y="158.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Concurrent isolation</text><text x="72" y="193.0" font-size="18" fill="#167d8d" text-anchor="start" font-weight="400">Local checks pass</text><text x="365" y="193.0" font-size="18" fill="#167d8d" text-anchor="start" font-weight="400">Each action closes</text><rect x="72" y="215" width="230" height="50" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="92" y="247.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Controller A</text><rect x="365" y="215" width="275" height="50" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="385" y="247.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Isolate instance A</text><path d="M302,240 L365,240" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="72" y="295" width="230" height="50" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="92" y="327.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Controller B</text><rect x="365" y="295" width="275" height="50" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="385" y="327.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Isolate instance B</text><path d="M302,320 L365,320" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M640,240 L736,240 L736,280 L802,280" fill="none" stroke="#b95e3c" stroke-width="2.5" marker-end="url(#rust)"/><path d="M640,320 L736,320 L736,280" fill="none" stroke="#b95e3c" stroke-width="2.5"/><rect x="802" y="225" width="326" height="110" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5"/><text x="824" y="260.0" font-size="22" fill="#b95e3c" text-anchor="start" font-weight="600">All capacity removed</text><text x="824" y="294.0" font-size="18" fill="#20363b" text-anchor="start" font-weight="400">Shared minimum-service</text><text x="824" y="317.4" font-size="18" fill="#20363b" text-anchor="start" font-weight="400">constraint</text><text x="779" y="352.0" font-size="18" fill="#b95e3c" text-anchor="start" font-weight="400">Constraint violated</text><rect x="48" y="394" width="1104" height="246" rx="12" fill="#ffffff" stroke="#bdd0d1" stroke-width="1.5"/><text x="72" y="430.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Coordination alternative · proposed comparison</text><rect x="72" y="466" width="248" height="96" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="92" y="500.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Same controllers</text><text x="92" y="534.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">A and B</text><rect x="403" y="466" width="405" height="96" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="423" y="500.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Coordination checks shared</text><text x="423" y="528.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">capacity</text><rect x="891" y="466" width="237" height="96" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="911" y="500.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Action decisions</text><text x="911" y="534.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">after checking</text><path d="M320,514 L403,514" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M808,514 L891,514" fill="none" stroke="#167d8d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="72" y="605.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Include stale shared-capacity observation in the comparison.</text><text x="48" y="680.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Coordination is a test alternative; no universal safety guarantee or observed outcome.</text></g></svg>