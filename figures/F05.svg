font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Task relevance and scope for the inspection</text><text x="68" y="352.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Traffic shifting</text><text x="344" y="338.0" font-size="22" fill="#167d8d" text-anchor="start" font-weight="600">Usable controls</text><text x="344" y="373.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Available capacity and</text><text x="344" y="399.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">a usable response</text><path d="M680,320 L680,412" fill="none" stroke="#bdd0d1" stroke-width="2.5" /><text x="704" y="337.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Consequences and remaining work</text><text x="704" y="373.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Consequence controls and</text><text x="704" y="399.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">feasible outstanding obligations</text><text x="68" y="501.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Schema reversal</text><text x="344" y="492.0" font-size="22" fill="#167d8d" text-anchor="start" font-weight="600">Compatibility</text><text x="344" y="527.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Current data and clients; reversal must also be available</text><rect x="48" y="580" width="1104" height="92" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="68" y="612.0" font-size="22" fill="#167d8d" text-anchor="start" font-weight="600">Current authority</text><text x="330" y="612.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Every action requires its own current authority and purpose.</text><text x="68" y="648.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="600">Check the dependencies of this transition</text><text x="628" y="648.0" font-size="18" fill="#52676c" 