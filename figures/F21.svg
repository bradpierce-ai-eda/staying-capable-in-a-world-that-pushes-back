<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 768" role="img" aria-labelledby="title"><title id="title">Continuity: evidence required for expansion</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="52.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Continuity: evidence required for expansion</text><text x="48" y="87.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Proposed / illustrative; not an empirical result</text><text x="48" y="127.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Backward requirements</text><text x="636" y="127.0" font-size="23" fill="#20363b" text-anchor="start" font-weight="600">Forward evidence</text><rect x="48" y="154" width="516" height="80" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="185.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">Portable meaning across</text><text x="70" y="213.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">environments</text><rect x="48" y="274" width="516" height="80" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="305.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">Replacement, successors</text><text x="70" y="333.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">and lasting duties</text><rect x="48" y="394" width="516" height="80" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="425.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">Resumption under</text><text x="70" y="453.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">changed conditions</text><rect x="48" y="514" width="516" height="80" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="70" y="545.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">One controlled pause</text><text x="70" y="573.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">and continuation</text><path d="M306,237 L306,271" fill="none" stroke="#20363b" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M306,357 L306,391" fill="none" stroke="#20363b" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M306,477 L306,511" fill="none" stroke="#20363b" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="636" y="154" width="516" height="58" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="658" y="179.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">Stage 6 · generalize supported</text><text x="658" y="205.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">continuity</text><rect x="636" y="234" width="516" height="58" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="658" y="270.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">Stage 5 · replace and translate</text><rect x="636" y="314" width="516" height="58" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="658" y="350.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">Stage 4 · earn the representation</text><rect x="636" y="394" width="516" height="58" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="658" y="419.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">Stage 3 · accepted and enforceable</text><text x="658" y="445.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">ownership</text><rect x="636" y="474" width="516" height="58" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="658" y="510.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">Stage 2 · challenge stored confidence</text><rect x="636" y="554" width="516" height="58" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="658" y="590.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="500">Stage 1 · one justified resumption</text><path d="M894,232 L894,214" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M894,312 L894,294" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M894,392 L894,374" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M894,472 L894,454" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M894,552 L894,534" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="48" y="639.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Arrows: dependencies ↓ / proposed evidence accumulation ↑</text><text x="48" y="669.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Capsule / shared state / reconstruction remain alternatives</text><text x="48" y="699.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Receipt alone doesn’t justify continuation.</text></g></svg>