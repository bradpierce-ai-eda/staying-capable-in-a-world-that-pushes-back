<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Before commitment, after commitment, still outstanding</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="66.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Before commitment, after commitment, still outstanding</text><text x="48" y="100.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Conceptual sequence • assurance, consequence evidence and continuing obligations</text><text x="48" y="148.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Before commitment</text><rect x="48" y="194" width="258" height="166" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="330" y="148.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Execution</text><rect x="330" y="194" width="258" height="166" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="612" y="148.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Consequence</text><text x="612" y="176.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">evidence</text><rect x="612" y="194" width="258" height="166" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="894" y="148.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Residual settlement</text><rect x="894" y="194" width="258" height="166" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="68" y="228.0" font-size="20" fill="#167d8d" text-anchor="start" font-weight="400">Pre-action evidence</text><path d="M176,242 L176,271" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="68" y="302.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Is this action</text><text x="68" y="328.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">justified now?</text><text x="350" y="233.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Commit action</text><text x="350" y="277.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">Execution requires</text><text x="350" y="303.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">resulting-state</text><text x="350" y="329.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">evidence</text><path d="M306,276 L328,276" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M588,276 L610,276" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="632" y="231.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">What actually</text><text x="632" y="257.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">happened?</text><text x="632" y="299.0" font-size="20" fill="#167d8d" text-anchor="start" font-weight="400">Read back effects</text><text x="914" y="231.0" font-size="20" fill="#20363b" text-anchor="start" font-weight="400">Preserve evidence,</text><text x="914" y="268.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">next check and</text><text x="914" y="294.0" font-size="20" fill="#52676c" text-anchor="start" font-weight="400">reopening trigger</text><rect x="612" y="385" width="258" height="113" rx="12" fill="#ffffff" stroke="#bdd0d1" stroke-width="1.5" /><text x="630" y="414.0" font-size="18" fill="#20363b" text-anchor="start" font-weight="600">Predicate and horizon</text><text x="630" y="445.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Closure applies to</text><text x="630" y="468.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">a specified claim</text><path d="M741,360 L741,372 L882,372 L882,543" fill="none" stroke="#b95e3c" stroke-width="2.5" marker-end="url(#rust)" /><text x="48" y="510.0" font-size="20" fill="#b95e3c" text-anchor="start" font-weight="600">Continuing residual work</text><path d="M48,543 L894,543" fill="none" stroke="#b95e3c" stroke-width="2.5" /><rect x="894" y="513" width="234" height="60" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5" /><text x="1011" y="550.0" font-size="18" fill="#20363b" text-anchor="middle" font-weight="600">Accepted ownership</text><path d="M1128,543 L1152,543" fill="none" stroke="#b95e3c" stroke-width="2.5" marker-end="url(#rust)" /><text x="660" y="610.0" font-size="22" fill="#b95e3c" text-anchor="start" font-weight="600">Work remains until settled</text><text x="660" y="649.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Ownership doesn’t settle effects</text><text x="660" y="672.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">or establish future capacity</text></g></svg>