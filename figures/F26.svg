<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Existing controls, a newly composed mode</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d" /></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c" /></marker></defs><rect width="100%" height="100%" fill="white" /><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="72.0" font-size="28" fill="#20363b" text-anchor="start" font-weight="600">Existing controls, a newly composed mode</text><text x="48" y="105.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Proposed / illustrative; not an empirical result</text><text x="70" y="146.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Available controls</text><rect x="70" y="168" width="320" height="54" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="90" y="202.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">Read-only operation</text><path d="M390,195 L440,195" fill="none" stroke="#167d8d" stroke-width="2.5" /><rect x="70" y="238" width="320" height="54" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="90" y="272.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">Feature isolation</text><path d="M390,265 L440,265" fill="none" stroke="#167d8d" stroke-width="2.5" /><rect x="70" y="308" width="320" height="54" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="90" y="342.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">Traffic limits</text><path d="M390,335 L440,335" fill="none" stroke="#167d8d" stroke-width="2.5" /><rect x="70" y="378" width="320" height="54" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="90" y="412.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="500">Roll-forward repair</text><path d="M390,405 L440,405" fill="none" stroke="#167d8d" stroke-width="2.5" /><path d="M440,195 L440,405" fill="none" stroke="#167d8d" stroke-width="2.5" /><path d="M440,300 L690,300" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="465" y="274.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Construct candidate</text><rect x="690" y="188" width="410" height="202" rx="12" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5" /><text x="714" y="225.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Candidate operating mode</text><text x="714" y="264.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Joint arrangement proposed</text><text x="714" y="328.0" font-size="22" fill="#b95e3c" text-anchor="start" font-weight="600">Proposal isn’t validation</text><text x="714" y="365.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Interoperability requires checking</text><path d="M895,390 L895,453 L174,453 L174,490" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="460" y="436.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Checking path</text><rect x="48" y="490" width="252" height="131" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="66" y="525.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Permissible</text><text x="66" y="553.6" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">transition path</text><text x="66" y="577.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Reachable under</text><text x="66" y="600.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">permitted transitions</text><rect x="332" y="490" width="252" height="131" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="350" y="525.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Admission</text><text x="350" y="577.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Authority, constraints</text><text x="350" y="600.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">and consequences</text><rect x="616" y="490" width="252" height="131" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5" /><text x="634" y="525.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Staged execution</text><text x="634" y="577.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Admitted sequence;</text><text x="634" y="600.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">observe bounds</text><rect x="900" y="490" width="252" height="131" rx="12" fill="#f4f6f6" stroke="#bdd0d1" stroke-width="1.5" /><text x="918" y="525.0" font-size="22" fill="#20363b" text-anchor="start" font-weight="600">Recovery verdict</text><text x="918" y="577.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Independent evidence;</text><text x="918" y="600.4" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">assess declared target</text><path d="M300,554 L328,554" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M584,554 L612,554" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M868,554 L896,554" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)" /><text x="48" y="644.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Execution follows admission; observations support the verdict.</text><text x="48" y="668.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Unknown or disputed observations remain distinct from success or failure.</text></g></svg>