<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title"><title id="title">An unresolved duty crosses a handoff</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95e3c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="70.0" font-size="18" fill="#52676c" text-anchor="start" font-weight="400">Illustrative responsibility handoff</text><rect x="48" y="98" width="310" height="174" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><rect x="850" y="98" width="302" height="174" rx="12" fill="#edf5f4" stroke="#bdd0d1" stroke-width="1.5"/><text x="72" y="137.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Current owner</text><path d="M326,212 L922,212" fill="none" stroke="#167d8d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="72" y="179" width="254" height="65" rx="8" fill="#faf0e9" stroke="#b95e3c" stroke-width="1.5"/><text x="199" y="219.0" font-size="22" fill="#b95e3c" text-anchor="middle" font-weight="600">Unresolved duty</text><text x="604" y="180.0" font-size="18" fill="#52676c" text-anchor="middle" font-weight="400">Until acceptance</text><text x="874" y="137.0" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">Capable receiver</text><text x="874" y="168.2" font-size="24" fill="#20363b" text-anchor="start" font-weight="600">accepts</text><circle cx="968" cy="212" r="22" fill="#167d8d"/><path d="M958,212 L965,219 L979,204" fill="none" stroke="white" stroke-width="2.5"/><text x="600" y="327.0" font-size="24" fill="#20363b" text-anchor="middle" font-weight="600">Responsibility persists through the handoff</text></g></svg>